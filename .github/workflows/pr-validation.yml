name: PR Validation

on:
  pull_request:
    branches: ['main', 'develop']

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ./.github/workflows/_frontend-tests.yml

  backend-build:
    uses: ./.github/workflows/_build-reusable.yml
    with:
      build-target: ./HousingApp.slnx

  backend-unit-tests:
    needs: backend-build
    uses: ./.github/workflows/_backend-unit-tests.yml

  backend-integration-tests:
    needs: backend-build
    uses: ./.github/workflows/_backend-integration-tests.yml

  # Docker build validation
  docker-build-validation:
    needs: [frontend, backend-unit-tests, backend-integration-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare scan report directory
        run: mkdir -p trivy-reports

      - name: Validate frontend Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: itersapiens-frontend:pr-${{ github.run_id }}
          build-args: |
            VITE_API_URL=http://localhost:8080
            VITE_GOOGLE_MAPS_API_KEY=dummy-key-for-pr
            VITE_GOOGLE_MAPS_ID=dummy-id-for-pr
            VITE_GOOGLE_CLIENT_ID=dummy-client-for-pr
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Validate backend Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: itersapiens-backend:pr-${{ github.run_id }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Generate frontend SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: itersapiens-frontend:pr-${{ github.run_id }}
          format: sarif
          output: trivy-reports/frontend-pr.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'
          limit-severities-for-sarif: true

      - name: Generate backend SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: itersapiens-backend:pr-${{ github.run_id }}
          format: sarif
          output: trivy-reports/backend-pr.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'
          limit-severities-for-sarif: true

      - name: Upload PR SARIF reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-trivy-sarif-reports
          path: trivy-reports/*.sarif
          retention-days: 14

      - name: Write PR security scan summary
        run: |
          {
            echo "## PR Docker Security Scan"
            echo ""
            echo "| Image | Tag | SARIF report | Blocking severity |"
            echo "| --- | --- | --- | --- |"
            echo "| Frontend | \`itersapiens-frontend:pr-${{ github.run_id }}\` | \`frontend-pr.sarif\` | CRITICAL |"
            echo "| Backend | \`itersapiens-backend:pr-${{ github.run_id }}\` | \`backend-pr.sarif\` | CRITICAL |"
            echo ""
            echo "PR validation generates SARIF artifacts and enforces the blocking policy separately. SARIF is not uploaded to Code Scanning from PR validation to avoid permission issues."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce frontend critical vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: itersapiens-frontend:pr-${{ github.run_id }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          exit-code: '1'

      - name: Enforce backend critical vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: itersapiens-backend:pr-${{ github.run_id }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          exit-code: '1'
