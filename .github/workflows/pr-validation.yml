name: PR Validation

on:
  pull_request:
    branches: ['main', 'develop']

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ./.github/workflows/_frontend-tests.yml

  backend-build:
    uses: ./.github/workflows/_build-reusable.yml
    with:
      build-target: ./HousingApp.slnx

  backend-unit-tests:
    needs: backend-build
    uses: ./.github/workflows/_backend-unit-tests.yml

  backend-integration-tests:
    needs: backend-build
    uses: ./.github/workflows/_backend-integration-tests.yml

  # Docker build validation
  docker-build-validation:
    needs: [frontend, backend-unit-tests, backend-integration-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate frontend Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: false
          build-args: |
            VITE_API_URL=http://localhost:8080
            VITE_GOOGLE_MAPS_API_KEY=dummy-key-for-pr
            VITE_GOOGLE_MAPS_ID=dummy-id-for-pr
            VITE_GOOGLE_CLIENT_ID=dummy-client-for-pr
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Validate backend Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
