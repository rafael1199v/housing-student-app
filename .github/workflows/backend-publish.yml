# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET unit testing

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'release/**']

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yml
    with:
      configuration: Release
      build-target: ./tests/HousingApp.Application.Tests/HousingApp.Application.Tests.csproj
      build-artifact-name: backend-build-output

  unit-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      CONFIGURATION: Release
      API_PROJECT: ./src/HousingApp.Api/HousingApp.Api.csproj

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            backend/**/packages.lock.json
            backend/Directory.Packages.props
            backend/**/*.csproj

      - name: Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-restore --output ./publish

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifact
          path: backend/publish
          retention-days: 7

