
name: .NET Integration Testing

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['develop', 'main', 'release/**']

jobs:
  build-and-test: 
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore backend/tests/HousingApp.IntegrationTests

    - name: Build project
      run: dotnet build backend/tests/HousingApp.IntegrationTests --no-restore

    - name: Integration Tests
      run: dotnet test backend/tests/HousingApp.IntegrationTests --no-build --verbosity normal
