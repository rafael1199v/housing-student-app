name: Deploy to Production

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: current SHA)'
        required: false
        type: string

permissions:
  contents: read
  checks: write
  security-events: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  frontend-tests:
    uses: ./.github/workflows/_frontend-tests.yml

  backend-build:
    uses: ./.github/workflows/_build-reusable.yml
    with:
      build-target: ./HousingApp.slnx

  backend-unit-tests:
    needs: backend-build
    uses: ./.github/workflows/_backend-unit-tests.yml

  backend-integration-tests:
    needs: backend-build
    uses: ./.github/workflows/_backend-integration-tests.yml

  build-push-scan:
    name: Build, push and scan images
    needs: [frontend-tests, backend-unit-tests, backend-integration-tests]
    runs-on: ubuntu-24.04
    environment: itersapiens-prod
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare scan report directory
        run: mkdir -p trivy-reports

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/itersapiens-frontend:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/itersapiens-frontend:latest
          build-args: |
            VITE_API_URL=https://api.itersapiens.rafael-vargas.dev
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_GOOGLE_MAPS_ID=${{ secrets.VITE_GOOGLE_MAPS_ID }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/itersapiens-backend:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/itersapiens-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Generate frontend SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/itersapiens-frontend:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-reports/frontend.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'
          limit-severities-for-sarif: true

      - name: Generate backend SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/itersapiens-backend:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-reports/backend.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'
          limit-severities-for-sarif: true

      - name: Upload frontend SARIF
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-reports/frontend.sarif
          category: trivy-frontend-image

      - name: Upload backend SARIF
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-reports/backend.sarif
          category: trivy-backend-image

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-sarif-reports
          path: trivy-reports/*.sarif
          retention-days: 14

      - name: Write image security scan summary
        run: |
          {
            echo "## Docker Image Security Scan"
            echo ""
            echo "| Image | Tag | SARIF category | Reported severities | Blocking severity |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| Frontend | \`${{ secrets.DOCKER_USERNAME }}/itersapiens-frontend:${{ steps.meta.outputs.tag }}\` | trivy-frontend-image | HIGH, CRITICAL | CRITICAL |"
            echo "| Backend | \`${{ secrets.DOCKER_USERNAME }}/itersapiens-backend:${{ steps.meta.outputs.tag }}\` | trivy-backend-image | HIGH, CRITICAL | CRITICAL |"
            echo ""
            echo "SARIF upload is configured as the primary security report path for Code Scanning. If repository permissions or Code Security settings block SARIF, the generated SARIF files are still uploaded as workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce frontend critical vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/itersapiens-frontend:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          exit-code: '1'

      - name: Enforce backend critical vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/itersapiens-backend:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          exit-code: '1'

  deploy:
    name: Deploy to production EC2
    needs: build-push-scan
    runs-on: ubuntu-24.04
    environment: itersapiens-prod
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        id: deploy-ssh
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build-push-scan.outputs.image-tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail

            # Crear .env temporal con permisos restringidos
            umask 077
            ENV_FILE=$(mktemp /tmp/itersapiens.env.XXXXXX)
            trap 'shred -u "$ENV_FILE" 2>/dev/null || rm -f "$ENV_FILE"' EXIT

            cat > "$ENV_FILE" << 'EOF'
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://+:8080
            Frontend__Origin=https://itersapiens.rafael-vargas.dev
            Jwt__SecretKey=${{ secrets.JWT_SECRET_KEY }}
            Jwt__Issuer=https://api.itersapiens.rafael-vargas.dev
            Jwt__Audience=https://itersapiens.rafael-vargas.dev
            Jwt__ExpirationInMinutes=${{ secrets.JWT_EXPIRATION_MINUTES }}
            AWS__AccessKey=${{ secrets.AWS_ACCESS_KEY }}
            AWS__SecretKey=${{ secrets.AWS_SECRET_KEY }}
            AWS__Region=${{ vars.AWS_REGION }}
            Storage__BucketName=${{ vars.STORAGE_BUCKET_NAME }}
            Google__ClientId=${{ secrets.GOOGLE_CLIENT_ID }}
            Resend__ApiKey=${{ secrets.RESEND_API_KEY }}
            Resend__FromEmail=${{ vars.RESEND_FROM_EMAIL }}
            ConnectionStrings__DefaultConnection=${{ secrets.CONNECTION_STRING_DEFAULT_CONNECTION }}
            EOF

            # Pull de la versión específica (SHA), no de :latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/itersapiens-frontend:$IMAGE_TAG
            docker pull ${{ secrets.DOCKER_USERNAME }}/itersapiens-backend:$IMAGE_TAG

            # Reemplazar containers
            docker stop itersapiens-frontend itersapiens-backend 2>/dev/null || true
            docker rm   itersapiens-frontend itersapiens-backend 2>/dev/null || true

            docker run -d \
              --name itersapiens-backend \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p ${{ vars.BACKEND_PORT }}:8080 \
              ${{ secrets.DOCKER_USERNAME }}/itersapiens-backend:$IMAGE_TAG

            docker run -d \
              --name itersapiens-frontend \
              --restart unless-stopped \
              -p ${{ vars.FRONTEND_PORT }}:8080 \
              ${{ secrets.DOCKER_USERNAME }}/itersapiens-frontend:$IMAGE_TAG

            # Health check básico
            sleep 5
            docker ps --filter "name=itersapiens-" --format "table {{.Names}}\t{{.Status}}"

            # Limpiar imágenes viejas para no llenar disco
            docker image prune -af --filter "until=168h"

      - name: Smoke test API
        id: smoke-test
        run: |
          for attempt in {1..12}; do
            response="$(curl -fsS --max-time 5 https://api.itersapiens.rafael-vargas.dev/api/ping || true)"

            if [ "$response" = "Pong" ]; then
              echo "API smoke test passed on attempt $attempt."
              exit 0
            fi

            echo "Waiting for API readiness. Attempt $attempt/12 returned: ${response:-no response}"
            sleep 5
          done

          echo "API smoke test failed: /api/ping did not return Pong."
          exit 1

      - name: Write deployment summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Production Deployment"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Image tag | \`${{ needs.build-push-scan.outputs.image-tag }}\` |"
            echo "| SSH deploy | ${{ steps.deploy-ssh.outcome }} |"
            echo "| Smoke test | ${{ steps.smoke-test.outcome }} |"
            echo "| API health endpoint | \`https://api.itersapiens.rafael-vargas.dev/api/ping\` |"
          } >> "$GITHUB_STEP_SUMMARY"
