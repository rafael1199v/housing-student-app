name: Frontend Unit Testing

on:
  push:
    branches: [ 'feature/**' ]
  pull_request:
    branches: [ 'develop' ]

jobs:
  build-and-test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: './frontend'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '21'
      
    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test
