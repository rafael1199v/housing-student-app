name: Backend Integration Tests (Reusable)

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        default: '10.0.x'
      configuration:
        type: string
        default: 'Release'
      build-artifact-name:
        type: string
        default: 'backend-build-output'

permissions:
  contents: read
  checks: write

jobs:
  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      INTEGRATION_TEST_PROJECT: ./tests/HousingApp.IntegrationTests/HousingApp.IntegrationTests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: |
            backend/**/packages.lock.json
            backend/Directory.Packages.props
            backend/**/*.csproj

      - name: Download compiled backend output
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.build-artifact-name }}
          path: backend/

      - name: Run integration tests
        run: |
          dotnet test ${{ env.INTEGRATION_TEST_PROJECT }} \
            --configuration ${{ inputs.configuration }} \
            --no-build --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./TestResults

      - name: Publish integration test report
        id: integration-test-report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Backend Integration Tests
          path: backend/TestResults/integration-tests.trx
          reporter: dotnet-trx
          use-actions-summary: true
          report-title: Backend Integration Tests
          badge-title: integration tests
          fail-on-error: true
          fail-on-empty: true

      - name: Write integration test summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Backend Integration Tests"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Conclusion | ${{ steps.integration-test-report.outputs.conclusion }} |"
            echo "| Passed | ${{ steps.integration-test-report.outputs.passed }} |"
            echo "| Failed | ${{ steps.integration-test-report.outputs.failed }} |"
            echo "| Skipped | ${{ steps.integration-test-report.outputs.skipped }} |"
            echo "| Report | ${{ steps.integration-test-report.outputs.url_html }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-test-results
          path: backend/TestResults/
          retention-days: 7
