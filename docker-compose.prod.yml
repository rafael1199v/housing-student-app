# Production overrides.
# Run with: docker compose -f docker-compose.yaml -f docker-compose.prod.yml up -d
#
# Key behaviours:
#   - Full multi-stage builds → smallest possible images, no dev tooling
#   - NO bind mounts: the image is fully self-contained
#   - Non-root user enforced inside each image
#   - Restart policy ensures services recover automatically

services:

  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    container_name: housing-api-prod
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Frontend origin for CORS policy — required at startup; pass via .env or CI secrets
      Frontend__Origin: ${FRONTEND_ORIGIN}

      # JWT — required at startup; pass via .env or CI secrets
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpirationInMinutes: ${JWT_EXPIRATION_MINUTES}

      # AWS S3
      AWS__AccessKey: ${AWS_ACCESS_KEY}
      AWS__SecretKey: ${AWS_SECRET_KEY}
      AWS__Region: ${AWS_REGION}
      Storage__BucketName: ${STORAGE_BUCKET_NAME}

      # Google OAuth
      Google__ClientId: ${GOOGLE_CLIENT_ID}

      # Resend (email service)
      Resend__ApiKey: ${RESEND_API_KEY}
      Resend__FromEmail: ${RESEND_FROM_EMAIL}

      # Connection string — required at startup; pass via .env or CI secrets
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING_DEFAULT_CONNECTION}

    # No volumes: image is self-contained (Part 8 — Production)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────────────
  # TODO: configure once frontend Dockerfile is finalized.
  # Suggested config when ready:
  #
  frontend:
    build:
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
        - VITE_GOOGLE_MAPS_ID=${VITE_GOOGLE_MAPS_ID}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: itersapiens-frontend-prod
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      NODE_ENV: production
    # No volumes: dist is baked into the image
    restart: unless-stopped
    depends_on:
      - api

  db:
    container_name: itersapiens-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-itersapiensDb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - itersapiens-db-prod:/var/lib/postgresql/data

volumes:
  itersapiens-db-prod: