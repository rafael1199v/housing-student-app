# Base configuration shared between dev and prod.
# Usage:
#   Development (auto-loads docker-compose.override.yml):
#     docker compose up
#   Production:
#     docker compose -f docker-compose.yaml -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:18.1-alpine
    container_name: itersapiens-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-itersapiensDb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - itersapiens-db:/var/lib/postgresql/data
      - ./backend/database-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-itersapiensDb}"]
      interval: 10s
      retries: 5
      start_period: 20s

volumes:
  itersapiens-db:
