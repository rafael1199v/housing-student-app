# Base configuration shared between dev and prod.
# Usage:
#   Development (auto-loads docker-compose.override.yml):
#     docker compose up
#   Production:
#     docker compose -f docker-compose.yaml -f docker-compose.prod.yml up -d

services:
  api:
    build:
      context: ./backend
  frontend:
    build:
      context: ./frontend
  db:
    image: postgres:18.1-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-itersapiensDb}"]
      interval: 10s
      retries: 5
      start_period: 20s